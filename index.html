<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Etch-a-Sketch</h1>

    <div class="controls">
      <button id="new-grid">New grid</button>
      <button id="clear">Clear</button>
      <button id="black" class="mode active">Black</button>
      <button id="rainbow" class="mode">Rainbow</button>
      <button id="darken" class="mode">Darken</button>
    </div>

    <p id="size-label"></p>

    <div id="container"></div>
  </body>
</html>
